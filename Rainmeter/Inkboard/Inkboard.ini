; Kindle Dashboard en el escritorio: descarga /widget.png del servidor cada pocos minutos
; y lo pinta encima del fondo de Windows y debajo de todas las ventanas.
; La configuracion (servidor, clave, pantalla, ancho, monitor, lado) esta en @Resources\Variables.inc.

[Rainmeter]
Update=1000
AccurateText=1
; Al cargar: fijo en el escritorio, sin arrastrar y colocado en el monitor elegido.
OnRefreshAction=[!ZPos "-2"][!Draggable "0"][!KeepOnScreen "0"][!SnapEdges "0"]
ContextTitle=Abrir en el navegador
ContextAction=["#ServerUrl#/web"]
ContextTitle2=Actualizar ahora
ContextAction2=[!CommandMeasure MeasureDashboard "Update"]

[Metadata]
Name=Kindle Dashboard
Author=kindle-dashboard
Information=Dashboard del Kindle en tema oscuro sobre el fondo de escritorio. Clic para abrir la web.
License=Uso personal

[Variables]
; Pantalla del dashboard (0 = metricas, 1 = red local). Variables.inc la sobrescribe.
Page=0
@Include=#@#Variables.inc

; --- Posicion: esquina superior del monitor #Monitor#, a la derecha (Align=1) o a la izquierda (Align=0) ---

; [#WORKAREAX@[#Monitor]] es la sintaxis de variables anidadas: el area de trabajo del monitor elegido.
[MeasureX]
Measure=Calc
Formula=[#Align] * ([#WORKAREAX@[#Monitor]] + [#WORKAREAWIDTH@[#Monitor]] - [#Width] - [#Margin]) + (1 - [#Align]) * ([#WORKAREAX@[#Monitor]] + [#Margin])
DynamicVariables=1
UpdateDivider=-1

[MeasureY]
Measure=Calc
Formula=[#WORKAREAY@[#Monitor]] + [#Margin]
DynamicVariables=1
UpdateDivider=-1

[MeasurePlace]
Measure=Calc
Formula=1
UpdateDivider=-1
OnUpdateAction=[!Move "[MeasureX]" "[MeasureY]"]

; --- Imagen: el servidor la dibuja ya al ancho pedido, con fondo transparente ---

[MeasureDashboard]
Measure=WebParser
URL=#ServerUrl#/widget.png?key=#Key#&w=#Width#&theme=#Theme#&page=#Page#
Download=1
DownloadFile=dashboard.png
UpdateRate=#UpdateRate#
FinishAction=[!UpdateMeter MeterDashboard][!Redraw]

[MeterDashboard]
Meter=Image
MeasureName=MeasureDashboard
W=#Width#
PreserveAspectRatio=1
SolidColor=0,0,0,1
LeftMouseUpAction=["#ServerUrl#/web"]
ToolTipText=Abrir el dashboard en el navegador
